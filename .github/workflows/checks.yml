# Every check this repo runs, on every push and every pull request.
#
# What is actually being protected here: these scripts run as hooks on every
# file write and every Bash call in every session, on two operating systems. A
# broken one does not throw an error anybody sees -- it either stops gating and
# lets broken code through silently, or starts gating correct work and gets
# switched off. Neither shows up until something has already gone wrong, which
# is exactly the kind of thing that needs a check on the commit.
#
# Both operating systems, because the hooks genuinely run on both. Ubuntu is
# what cloud sessions run on. Windows is the machine the work actually happens
# on, and the suite carries real accommodations for it -- the
# python3/python/py interpreter fallback, stripping the carriage returns
# python writes into text on Windows, tolerating a still-held file handle at
# cleanup. Running Ubuntu alone left every one of those unexercised, so a
# change that broke Git Bash stayed green here and surfaced interactively
# instead.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      # Windows failing must not cancel the Ubuntu answer, or vice versa: which
      # platforms broke is the whole diagnostic here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # The suite is bash. On the Windows runner the default shell is PowerShell,
    # so without this every `run:` below would be parsed by the wrong shell.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # node is what the JS half of the syntax gate shells out to. The runner
      # has it already; naming it here is what makes those assertions actually
      # run rather than skip, which is the whole reason they exist.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Confirm the JS check can actually run here
        run: node --version

      - name: Run the suite
        run: bash tests/run-tests.sh

  # Separate job: shellcheck is a static analyser, so its answer does not depend
  # on anything the suite sets up, and a lint failure stays legible as a lint
  # failure rather than as "the tests went red".
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # -e SC1091: the hooks source lib.sh through a path built at runtime from
      # ${CLAUDE_PLUGIN_ROOT}, which shellcheck cannot follow and would report
      # on every single file. Everything else stays switched on.
      - name: Lint the hook scripts
        run: shellcheck -e SC1091 plugins/house/scripts/*.sh cloud-setup.sh tests/run-tests.sh ci/*.sh

  # The most consequential silent failure this repo has. Installs only pick up
  # new hook code when `version` in plugin.json moves, so a change to the
  # plugin that forgets the bump ships nothing: every machine and every cloud
  # session keeps running the old scripts, the PR is green, the commit is on
  # main, and the fix is simply not in effect anywhere. Nothing about that is
  # visible until someone notices the old behaviour months later.
  #
  # PR-only on purpose: it needs a base branch to diff against, which a bare
  # push to a branch does not have.
  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Full history: the merge-base with the target branch has to be reachable
      # or the three-dot diff below has nothing to compare against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The check lives in a script rather than inline here so the suite can
      # exercise it against fixture repos. An inline YAML gate that quietly
      # stopped failing would be invisible in exactly the way this repo tests
      # against everywhere else.
      - name: Require a version bump when the plugin changes
        run: bash ci/require-version-bump.sh "origin/${{ github.base_ref }}"
